<form class="contact-form" name="contatto" method="POST" action="/grazie/" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contatto" />
    <p style="display:none"><label>Non compilare: <input name="bot-field" /></label></p>
    <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required autocomplete="name" placeholder="Il tuo nome" />
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="La tua email" />
    </div>
    <div class="form-group">
        <label for="messaggio">Messaggio</label>
        <textarea id="messaggio" name="messaggio" required
            placeholder="Ciao Marco, ho uno studio a Frascati e mi servirebbe..."></textarea>
    </div>
    <p class="form-privacy" style="font-size:12px;line-height:1.6;color:var(--text-secondary);margin:0.25rem 0 1rem;">
        Uso i tuoi dati solo per risponderti. Dettagli nella
        <a href="https://www.iubenda.com/privacy-policy/88789889" class="iubenda-noiframe iubenda-embed" style="color:var(--green);">privacy policy</a>.
    </p>
    <button type="submit" class="btn-primary">Invia messaggio</button>
</form>
