<section class="page-head">
  <div class="wrap grid">
    <div class="ph-text">
      {{ with .crumb }}<p class="crumbs"><a href="{{ .url }}">{{ .label }}</a></p>{{ end }}
      <h1>{{ .title }}</h1>
      {{ with .lead }}<p class="lead">{{ . }}</p>{{ end }}
      {{ with .extra }}{{ . }}{{ end }}
    </div>
    <div class="ph-mark mark-{{ .mark | default "red" }}" aria-hidden="true"></div>
  </div>
</section>
