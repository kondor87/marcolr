baseURL = "https://laroccadigitale.it/"
languageCode = "it"
title = "Marco La Rocca — Siti Web · Frascati"

[params]
  description = "Realizzo siti web per professionisti e attività locali a Frascati e nei Castelli Romani. Design curato, SEO locale, prezzi onesti. Scrivimi senza impegno."
  author = "Marco La Rocca"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# SEO
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params.sitemap]
  priority = 0.5
  
[params.sitemap.home]
  priority = 1.0

[outputs]
  home = ["HTML", "RSS"]
