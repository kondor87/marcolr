baseURL = "https://laroccadigitale.it/"
languageCode = "it"
title = "Marco La Rocca — Siti Web · Frascati"

[params]
  description = "Realizzo siti web per professionisti e attività locali a Frascati e nei Castelli Romani. Design curato, SEO locale, prezzi onesti. Scrivimi senza impegno."
  author = "Marco La Rocca"

[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# SEO
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "RSS"]
