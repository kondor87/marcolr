[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.158.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Dal 2026-10-17 il sito carica solo risorse proprie (niente iubenda, Clarity, Google).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# CSS con nome "fingerprint": può restare in cache per sempre.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini: le versioni WebP generate da Hugo hanno un hash nel nome.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# La landing locale è passata dal blog a una pagina dedicata.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 301

[[redirects]]
  from = "/blog/siti-web-castelli-romani/"
  to = "/siti-web-frascati-castelli-romani/"
  status = 301

[[redirects]]
  from = "/categories/manutenzione/"
  to = "/categories/wordpress/"
  status = 301

# Le pagine dei tag non esistono più (erano quasi tutte vuote).
[[redirects]]
  from = "/tags/*"
  to = "/blog/"
  status = 301
